<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rooms - Socum</title>

    <link rel="stylesheet" href="CSS/master.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">

    <div class="logo">
        <img src="images/logo.png">
    </div>

    <span class="Raf">RafiQ</span>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="main.html">Home</a>
        <a href="about.html">About</a>
        <a href="features.html">Features</a>
        <a href="settings.html">Settings</a>
    </div>

</nav>


<!-- ================= DARK MODE ================= -->
<div id="themeWidget" class="theme-widget">

    <span class="icon sun">
        <i class="fa-solid fa-sun"></i>
    </span>

    <label class="switch">
        <input type="checkbox" id="darkToggle">
        <span class="slider"></span>
    </label>

    <span class="icon moon">
        <i class="fa-solid fa-moon"></i>
    </span>

</div>


<!-- ================= APP ================= -->
<div class="app">

    <!-- SIDEBAR -->
    <div class="rooms-sidebar">

        <h2>Rooms</h2>

        <input type="text" placeholder="Search rooms..." id="searchInput">

        <div class="room-list" id="roomList"></div>

        <button class="add-room" onclick="addRoom()">+ Add Room</button>

    </div>


    <!-- MAIN CHAT -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <h2 id="roomTitle">Select a room</h2>

            <button class="call-btn" onclick="startCall()">
                <i class="fa-solid fa-video"></i> Call
            </button>

        </div>


        <!-- CHAT BOX -->
        <div class="chat-box" id="chatBox"></div>


        <!-- INPUT AREA (ONLY ONE - FIXED) -->
        <div class="input-box">

            <!-- file upload -->
            <input type="file" id="fileInput" hidden onchange="handleFile(event)">

            <button class="icon-btn" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-paperclip"></i>
            </button>

            <!-- message input -->
            <input type="text" id="msgInput" placeholder="Type message...">

            <!-- send -->
            <button onclick="sendMessage()">Send</button>

        </div>

    </div>


    <!-- RIGHT PANEL -->
 <div class="right">

    <h3 id="activeRoomName">No room selected</h3>

    <div class="room-stats">
        <p>Messages: <span id="msgCount">0</span></p>
    </div>

    <div class="room-members">
        <h4>Members</h4>
        <ul id="memberList">
            <li>No members</li>
        </ul>
    </div>

    <button onclick="clearChat()" class="btn danger">
        Clear Chat
    </button>

</div>



<!-- ================= SCRIPT ================= -->
<script src="JS/master.js"></script>
<audio id="ringtone" src="images/WhatsApp Ptt 2026-04-01 at 8.35.48 PM.ogg" preload="auto"></audio>
</body>
</html>
