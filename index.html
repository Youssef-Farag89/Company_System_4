<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Design</title>
    <link rel="stylesheet" href="CSS/master.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- setting box Start -->
     <div class="setting_box">
        <div class="icons_settings">
            <i class="fa-solid fa-gear"></i>
        </div>
        <div class="setting_container">
            <div class="options_box">
                <h1>Colors</h1>
                <ul class="list">
                    <li class="active" data-color="#E09B03"></li>
                    <li data-color="#008889"></li>
                    <li data-color="#B63956"></li>
                    <li data-color="#429D52"></li>
                    <li data-color="#2F374A"></li>
                </ul>
                
                <div class="options_2_box">
                    <h2>Random Images</h2>
                    <div class="randback">
                        <button class="yes active" data-back="yes">Yes</button>
                    <button class="no" data-back="no">No</button>
                    </div>
                </div>
            </div>
        </div>
     </div>
     <!-- setting box End -->
      <!-- header Start -->
       <div class="header">
            <div class="logo">
                <img src="images/Gemini_Generated_Image_5at7ef5at7ef5at7.png"/>
            </div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">tasks</a></li>
                <li><a href="#">services</a></li>
                <li><a href="#">chat</a></li>
            </ul>
        </div>
       <!-- header End -->
    <!-- landing_page Start -->
     <div class="container">
    <div class="landing_page">
        <div class="intro_text">
            <h1>Empowering <span>Teams</span>.<br> Simplifying <span>Work</span>.</h1>
            <p class="p1">Manage your tasks, collaborate with your team, and stay productive — all in one place.</p>     
        </div>
        
    </div>
    <button>Learn More</button>
    </div>
    <!-- landing_page End -->
    <script src="JS/master.js"></script>
</body>
</html>
